<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KINGDOM SMP Tier List</title>
<meta name="description" content="Official player tier list for the KINGDOM SMP Minecraft PVP server." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: 'VT323', 'Courier New', monospace;
    background: #07060a;
    color: #fff;
    min-height: 100vh;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 20% 10%, rgba(255,170,40,0.18), transparent 45%),
      radial-gradient(circle at 80% 30%, rgba(170,60,255,0.18), transparent 50%),
      radial-gradient(circle at 50% 90%, rgba(60,200,255,0.15), transparent 55%);
    z-index: -2;
    animation: drift 14s ease-in-out infinite alternate;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: -1;
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }
  @keyframes drift {
    0% { transform: translate3d(0,0,0) scale(1); }
    100% { transform: translate3d(-20px,20px,0) scale(1.08); }
  }
  .wrapper { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  header { text-align: center; margin-bottom: 50px; }
  .eyebrow {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    letter-spacing: 0.5em;
    color: #ffb84d;
    text-shadow: 0 0 12px rgba(255,170,40,0.6);
    margin-bottom: 20px;
  }
  h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(28px, 6vw, 56px);
    background: linear-gradient(180deg, #fff5c2 0%, #ffaa28 50%, #c2410c 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 30px rgba(255,170,40,0.4));
    line-height: 1.2;
    animation: glow 3s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 20px rgba(255,170,40,0.3)); }
    to   { filter: drop-shadow(3px 4px 0 rgba(0,0,0,0.9)) drop-shadow(0 0 40px rgba(255,170,40,0.7)); }
  }
  .subtitle { font-size: 24px; color: #d6d3d1; margin-top: 12px; letter-spacing: 0.15em; }
  .ip-btn {
    margin-top: 24px;
    display: inline-flex; align-items: center; gap: 14px;
    background: rgba(0,0,0,0.7);
    border: 2px solid #fff;
    color: #fff;
    padding: 12px 22px;
    font-family: 'VT323', monospace;
    font-size: 20px;
    cursor: pointer;
    border-radius: 4px;
    backdrop-filter: blur(6px);
    transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 4px 4px 0 #000;
  }
  .ip-btn:hover {
    background: #fff; color: #000;
    transform: translate(-2px,-2px);
    box-shadow: 0 0 24px rgba(255,255,255,0.5), 6px 6px 0 #000;
  }
  .ip-btn .label { font-family: 'Press Start 2P', monospace; font-size: 9px; letter-spacing: 0.3em; opacity: 0.75; }
  .ip-btn .ip { font-weight: bold; font-size: 22px; }
  .ip-btn .copy { font-size: 14px; opacity: 0.8; }
  .tierlist {
    border: 3px solid #000;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(15,12,20,0.85);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 30px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .section-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 14px;
    padding: 18px 22px;
    background: linear-gradient(90deg, rgba(255,170,40,0.15), transparent);
    border-bottom: 2px solid #000;
    letter-spacing: 0.2em;
    color: #ffd27a;
    text-shadow: 2px 2px 0 #000;
  }
  .tier-row { display: grid; grid-template-columns: 120px 1fr; border-bottom: 2px solid #000; min-height: 100px; }
  .tier-row:last-child { border-bottom: 0; }
  .tier-label {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 32px;
    color: #1a1208;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.25);
    border-right: 2px solid #000;
    position: relative;
    overflow: hidden;
  }
  .tier-label::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent 40%, rgba(0,0,0,0.2));
    pointer-events: none;
  }
  .tier-s { background: linear-gradient(135deg, #ff4757, #c2185b); }
  .tier-a { background: linear-gradient(135deg, #ff9a3c, #e76f00); }
  .tier-b { background: linear-gradient(135deg, #ffd93d, #f59e0b); }
  .tier-c { background: linear-gradient(135deg, #6bcf63, #2e8b3e); }
  .tier-d { background: linear-gradient(135deg, #4dabf7, #1864ab); }
  .tier-f { background: linear-gradient(135deg, #9d4edd, #5a189a); }
  .tier-tc { background: linear-gradient(135deg, #f5f5f5, #b0b0b0); font-size: 14px; padding: 0 6px; text-align: center; line-height: 1.1; }
  .tier-content {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 16px;
    background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent), rgba(20,18,28,0.6);
  }
  .empty { font-size: 18px; color: #6b6570; font-style: italic; }
  .player {
    display: inline-flex; align-items: center; gap: 10px;
    background: #000;
    border: 2px solid #fff;
    border-radius: 6px;
    padding: 8px 12px;
    color: #fff;
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 0.05em;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.8);
    transition: transform 0.18s ease, box-shadow 0.25s ease, border-color 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .player::before {
    content: '';
    position: absolute; top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
    transition: left 0.5s ease;
  }
  .player:hover {
    transform: translate(-3px,-3px) scale(1.05);
    box-shadow: 6px 6px 0 #000, 0 0 22px rgba(255,255,255,0.4);
    border-color: #ffd27a;
  }
  .player:hover::before { left: 100%; }
  .player img { width: 38px; height: 38px; image-rendering: pixelated; border: 1px solid rgba(255,255,255,0.4); }
  footer { margin-top: 30px; text-align: center; font-size: 18px; color: #6b6570; letter-spacing: 0.1em; }
</style>
</head>
<body>
  <div class="wrapper">
    <header>
      <div class="eyebrow">MINECRAFT PVP SERVER</div>
      <h1>KINGDOM SMP</h1>
      <div class="subtitle">— OFFICIAL PLAYER TIER LIST —</div>
      <button class="ip-btn" onclick="copyIP(this)" aria-label="Copy server IP">
        <span class="label">SERVER IP</span>
        <span class="ip">91.244.70.178:25521</span>
        <span class="copy">📋 Copy</span>
      </button>
    </header>

    <div class="tierlist">
      <div class="tier-row">
        <div class="tier-label tier-s">S</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/balanxe/40" alt=""><span>balanxe</span></div>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-label tier-a">A</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/ShaqOatmeals/40" alt=""><span>ShaqOatmeals</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/Mazte/40" alt=""><span>Mazte</span></div>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-label tier-b">B</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/TemWasntHere/40" alt=""><span>TemWasntHere</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/HoloVertex/40" alt=""><span>HoloVertex</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/itzfuzzu/40" alt=""><span>itzfuzzu</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/Tursass/40" alt=""><span>Tursass</span></div>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-label tier-c">C</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/TAMEME/40" alt=""><span>TAMEME</span></div>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-label tier-d">D</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/Lordandrija/40" alt=""><span>Lordandrija</span></div>
        </div>
      </div>
      <div class="tier-row">
        <div class="tier-label tier-f">F</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/Poplizard2/40" alt=""><span>Poplizard2</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/XFERN0_/40" alt=""><span>XFERN0_</span></div>
        </div>
      </div>

      <div class="section-title">⚔ TRUE CALAMITY ⚔</div>
      <div class="tier-row">
        <div class="tier-label tier-tc">TRUE<br>CALAMITY</div>
        <div class="tier-content">
          <div class="player"><img src="https://mc-heads.net/avatar/Timthecrafter29/40" alt=""><span>Timthecrafter29</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/Chosen/40" alt=""><span>Chosen</span></div>
        </div>
      </div>
    </div>

    <footer>⛏ RANKINGS BASED ON PVP PERFORMANCE ⛏</footer>
  </div>

<script>
  function copyIP(btn) {
    navigator.clipboard.writeText('91.244.70.178:25521').then(() => {
      const copy = btn.querySelector('.copy');
      const original = copy.textContent;
      copy.textContent = '✓ Copied!';
      setTimeout(() => { copy.textContent = original; }, 1500);
    });
  }
</script>
</body>
</html>
