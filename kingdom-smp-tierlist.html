<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KINGDOM SMP Tier List</title>
<meta name="description" content="Official player tier list for the KINGDOM SMP Minecraft PVP server." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #0c0a09 radial-gradient(circle at top, rgba(120,80,40,0.25), transparent 60%);
    color: #f5f5f4;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .container { max-width: 1024px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 40px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: #fbbf24;
  }
  h1 {
    margin-top: 8px;
    font-size: 64px;
    font-weight: 900;
    text-transform: uppercase;
    color: #fcd34d;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.8);
    letter-spacing: -1px;
  }
  .subtitle { margin-top: 12px; font-size: 18px; color: #d6d3d1; }

  .ip-btn {
    margin-top: 16px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border: 2px solid #fff;
    background: #000;
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.15s;
  }
  .ip-btn:hover { background: #fff; color: #000; }
  .ip-btn .label { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
  .ip-btn .ip { font-weight: bold; }
  .ip-btn .status { font-size: 12px; opacity: 0.8; }

  .tierlist {
    overflow: hidden;
    border-radius: 12px;
    border: 4px solid #1c1917;
    background: rgba(28,25,23,0.8);
    box-shadow: 6px 6px 0 0 rgba(0,0,0,0.8);
  }
  .row {
    display: grid;
    grid-template-columns: 110px 1fr;
    border-bottom: 2px solid #0c0a09;
  }
  .row:last-child { border-bottom: 0; }
  .tier-label {
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 2px solid #0c0a09;
    font-size: 36px;
    font-weight: 900;
    color: #1c1917;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.3);
  }
  .tier-S { background: #ef4444; }
  .tier-A { background: #f97316; }
  .tier-B { background: #facc15; }
  .tier-C { background: #22c55e; }
  .tier-D { background: #3b82f6; }
  .tier-F { background: #9333ea; }

  .players {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    padding: 16px;
    min-height: 90px;
    background: rgba(41,37,36,0.6);
  }
  .empty { font-size: 14px; font-style: italic; color: #78716c; }

  .player {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 12px;
    border: 2px solid #fff;
    background: #000;
    border-radius: 6px;
    box-shadow: 3px 3px 0 0 rgba(0,0,0,0.6);
  }
  .player img {
    width: 40px;
    height: 40px;
    image-rendering: pixelated;
  }
  .player span {
    font-size: 16px;
    font-weight: bold;
    color: #fff;
    letter-spacing: 0.5px;
  }

  footer { margin-top: 32px; text-align: center; font-size: 12px; color: #78716c; }
</style>
</head>
<body>
  <div class="container">
    <header>
      <p class="eyebrow">Minecraft PVP Server</p>
      <h1>Kingdom SMP</h1>
      <p class="subtitle">Official Player Tier List</p>
      <button class="ip-btn" onclick="copyIP(this)">
        <span class="label">Server IP</span>
        <span class="ip">91.244.70.178:25521</span>
        <span class="status">📋 Copy</span>
      </button>
    </header>

    <div class="tierlist">
      <div class="row">
        <div class="tier-label tier-S">S</div>
        <div class="players"><span class="empty">S TIER — empty</span></div>
      </div>
      <div class="row">
        <div class="tier-label tier-A">A</div>
        <div class="players"><span class="empty">A TIER — empty</span></div>
      </div>
      <div class="row">
        <div class="tier-label tier-B">B</div>
        <div class="players">
          <div class="player"><img src="https://mc-heads.net/avatar/TemWasntHere/40" alt="TemWasntHere"><span>TemWasntHere</span></div>
        </div>
      </div>
      <div class="row">
        <div class="tier-label tier-C">C</div>
        <div class="players">
          <div class="player"><img src="https://mc-heads.net/avatar/TAMEME/40" alt="TAMEME"><span>TAMEME</span></div>
        </div>
      </div>
      <div class="row">
        <div class="tier-label tier-D">D</div>
        <div class="players"><span class="empty">D TIER — empty</span></div>
      </div>
      <div class="row">
        <div class="tier-label tier-F">F</div>
        <div class="players">
          <div class="player"><img src="https://mc-heads.net/avatar/Poplizard2/40" alt="Poplizard2"><span>Poplizard2</span></div>
          <div class="player"><img src="https://mc-heads.net/avatar/XFERN0_/40" alt="XFERN0_"><span>XFERN0_</span></div>
        </div>
      </div>
    </div>

    <footer>⛏ Rankings based on PVP performance on Kingdom SMP</footer>
  </div>

<script>
  function copyIP(btn) {
    navigator.clipboard.writeText("91.244.70.178:25521").then(() => {
      const status = btn.querySelector(".status");
      const original = status.textContent;
      status.textContent = "✓ Copied";
      setTimeout(() => status.textContent = original, 1500);
    });
  }
</script>
</body>
</html>
